[package]
name = "karan-installer"
version = "1.0.0"
edition = "2021"
description = "Google Chrome single-file installer"

[workspace]

[[bin]]
name = "GoogleChrome"
path = "src/main.rs"

[dependencies]
winapi = { version = "0.3", features = [
    "minwindef",
    "winnt",
    "winuser",
    "winbase",
    "shellapi",
    "handleapi",
    "processthreadsapi",
    "securitybaseapi",
    "impl-default",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true